<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1 class="title">2048</h1>
      <p class="subtitle">방향키(또는 스와이프)로 타일을 밀어 같은 숫자를 합쳐보세요.</p>
    </header>

    <div class="top-row">
      <div class="score-row">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
      <button type="button" class="new-game-btn" id="new-game-btn">새 게임</button>
    </div>

    <div class="board-wrapper" id="board-wrapper">
      <div class="board" id="board">
        <div class="grid-cell" style="grid-row:1;grid-column:1"></div>
        <div class="grid-cell" style="grid-row:1;grid-column:2"></div>
        <div class="grid-cell" style="grid-row:1;grid-column:3"></div>
        <div class="grid-cell" style="grid-row:1;grid-column:4"></div>
        <div class="grid-cell" style="grid-row:2;grid-column:1"></div>
        <div class="grid-cell" style="grid-row:2;grid-column:2"></div>
        <div class="grid-cell" style="grid-row:2;grid-column:3"></div>
        <div class="grid-cell" style="grid-row:2;grid-column:4"></div>
        <div class="grid-cell" style="grid-row:3;grid-column:1"></div>
        <div class="grid-cell" style="grid-row:3;grid-column:2"></div>
        <div class="grid-cell" style="grid-row:3;grid-column:3"></div>
        <div class="grid-cell" style="grid-row:3;grid-column:4"></div>
        <div class="grid-cell" style="grid-row:4;grid-column:1"></div>
        <div class="grid-cell" style="grid-row:4;grid-column:2"></div>
        <div class="grid-cell" style="grid-row:4;grid-column:3"></div>
        <div class="grid-cell" style="grid-row:4;grid-column:4"></div>
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="overlay-content">
          <p class="overlay-message" id="overlay-message">Game Over!</p>
          <div class="overlay-buttons">
            <button type="button" class="overlay-btn hidden" id="overlay-continue-btn">계속하기</button>
            <button type="button" class="overlay-btn" id="overlay-restart-btn">새 게임</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="game-footer">
      <p>방향키 또는 화면 스와이프로 조작합니다.</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
