<li class="post-card" data-slug="{{slug}}" data-tags="{{tagsAttr}}">
  <a class="post-card-link" href="{{url}}">
    <h2 class="post-card-title">{{title}}</h2>
  </a>
  <div class="post-meta">
    <time datetime="{{dateIso}}">{{dateDisplay}}</time>
    {{tagsHtml}}
  </div>
  <p class="post-card-excerpt">{{excerpt}}</p>
</li>
